services:
  - type: web
    name: reforestation-planner
    runtime: python
    buildCommand: "pip install -r requirements.txt && npm --prefix frontend install && npm --prefix frontend run build"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20
